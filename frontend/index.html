<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Club Profile Registry</title>
    <!-- We link a crisp modern font styling layout directly -->
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-color: #ffffff;
            --primary-navy: #1e293b;
            --accent-gold: #b45309;
            --text-color: #334155;
            --border-color: #cbd5e1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            background-color: var(--primary-navy);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 25px;
        }
        .panel {
            background-color: var(--card-color);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
        }
        h2 {
            border-bottom: 2px solid var(--accent-gold);
            padding-bottom: 5px;
            color: var(--primary-navy);
            margin-top: 0;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media(max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group.full-width {
            grid-column: span 2;
        }
        @media(max-width: 600px) { .form-group.full-width { grid-column: span 1; } }
        label { font-weight: bold; font-size: 0.9rem; }
        input, select, textarea {
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
        }
        button {
            background-color: var(--accent-gold);
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .cancel-btn { background-color: #64748b; margin-left: 10px; }
        
        /* Roster grid table cards layout representation style */
        .roster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .club-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .club-title { font-size: 1.2rem; font-weight: bold; margin: 0 0 10px 0; color: var(--primary-navy); }
        .club-meta { font-size: 0.85rem; color: #64748b; margin-bottom: 5px; }
        .club-desc { font-size: 0.95rem; margin: 10px 0; flex-grow: 1; }
        .card-actions { display: flex; gap: 10px; margin-top: 15px; }
        .btn-sm { padding: 5px 10px; font-size: 0.85rem; }
        .btn-delete { background-color: #dc2626; }
        .hidden { display: none; }
    </style>
    <!-- Attach our dynamic app logical execution handler -->
    <script src="app.js" defer></script>
</head>
<body>

    <div class="container">
        <header>
            <h1>🏫 Campus Club Profile Registry</h1>
            <p>ICT251 Lab 4 Management Console — Saviour Ntendekelo</p>
        </header>

        <!-- Form Module: Manages both Create and Update visual actions -->
        <section class="panel">
            <h2 id="form-title">➕ Register a New Campus Club</h2>
            <form id="club-form">
                <!-- Secret utility field flag used by JS to separate Create from Update actions -->
                <input type="hidden" id="club-id">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Club Name:</label>
                        <input type="text" id="name" required placeholder="e.g., Chess Society">
                    </div>
                    <div class="form-group">
                        <label for="president">Club President:</label>
                        <input type="text" id="president" required placeholder="Full Student Name">
                    </div>
                    <div class="form-group">
                        <label for="category">Category Classification:</label>
                        <select id="category" required>
                            <option value="">-- Choose Category --</option>
                            <option value="Academic">Academic</option>
                            <option value="Music">Music</option>
                            <option value="Arts">Arts</option>
                            <option value="Sports">Sports</option>
                            <option value="Science">Science</option>
                            <option value="Business">Business</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="member_count">Active Registered Members:</label>
                        <input type="number" id="member_count" min="0" value="0" required>
                    </div>
                    <div class="form-group full-width">
                        <label for="description">Core Mission Description:</label>
                        <textarea id="description" rows="3" placeholder="Brief outline detailing club target operations..."></textarea>
                    </div>
                </div>
                
                <button type="submit" id="submit-btn">Save Club Profile</button>
                <button type="button" id="cancel-btn" class="cancel-btn hidden">Cancel Edit</button>
            </form>
        </section>

        <!-- Roster Module: Displays Read list outputs dynamically -->
        <section>
            <h2>📋 Active Registered Campus Roster</h2>
            <div id="roster-list" class="roster-grid">
                <!-- JavaScript DOM automation logic will populate entries here live -->
            </div>
        </section>
    </div>

</body>
</html>
